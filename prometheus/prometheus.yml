# Prometheus: what to collect, and how often.
#
# Each service serves its metrics on port 9100 inside the compose networks - never
# published, so only Prometheus reads them. Targets are compose service names,
# which Docker's DNS resolves.
#
# After an edit: check it, then restart Prometheus to load it.
#     docker compose exec prometheus promtool check config /etc/prometheus/prometheus.yml
#     docker compose restart prometheus

global:
  scrape_interval: 15s        # how often every target is asked
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: generator
    static_configs:
      - targets: ["generator:9100"]

  - job_name: api
    static_configs:
      - targets: ["api:9100"]

  - job_name: rules
    static_configs:
      - targets: ["rules:9100"]

  # Prometheus about itself: samples stored, scrape durations, its own memory
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
