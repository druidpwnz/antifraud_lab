name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# No repository secrets or write permissions are needed, including on fork PRs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Lint, secrets, admin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Gitleaks checks all history, not just the latest commit.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-lint.txt
            admin/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-lint.txt -r admin/requirements-dev.txt

      - name: Lint
        run: python -m ruff check --output-format=github .

      - name: Install Gitleaks
        # The CLI needs no license or GitHub token. Pin the archive as well as its version.
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          mkdir -p gitleaks-bin
          tar -xzf gitleaks.tar.gz -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan Git history for secrets
        # Include HEAD explicitly: on PRs it is GitHub's synthetic merge commit.
        # Redaction keeps any discovered secret out of the Actions log.
        run: gitleaks git --redact --log-opts="--all HEAD" .

      - name: Admin tests
        working-directory: admin
        run: python -m pytest -q

      - name: CI helper tests
        run: python -m pytest -q ci/tests

      - name: Deployment script and systemd unit validation
        run: |
          bash -n deploy/update.sh ci/publish_images.sh
          systemd-analyze verify deploy/antifraud-update.service deploy/antifraud-update.timer

  api:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: antifraud
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: antifraud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U antifraud -d antifraud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # This password is only for the disposable service container in this job.
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: antifraud
      PGPASSWORD: ci-only-password
      PGDATABASE: antifraud_test
      # Empty DSNs make psycopg use PG* above, for both migration and test code.
      DATABASE_URL: ''
      TEST_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r api/requirements-dev.txt

      - name: Apply all migrations to the test database
        run: python db/migrate.py

      - name: API tests
        working-directory: api
        run: python -m pytest -q

  rules:
    name: Detection rule tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Jobs run on separate machines: this database is not the API job's database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: antifraud
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: antifraud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U antifraud -d antifraud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: antifraud
      PGPASSWORD: ci-only-password
      PGDATABASE: antifraud_test
      DATABASE_URL: ''
      TEST_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: rules/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r rules/requirements-dev.txt

      - name: Apply all migrations to the test database
        run: python db/migrate.py

      - name: Detection rule tests
        working-directory: rules
        run: python -m pytest -q

  stack:
    name: Full stack
    needs: [checks, api, rules]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Separate from the home lab's fixed Compose name. Volumes are disposable.
      COMPOSE_PROJECT_NAME: antifraud-ci
      BUILD_VERSION: ${{ github.sha }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Newman
        run: npm install --prefix "$RUNNER_TEMP/newman" --no-audit --no-fund newman@6.2.3

      - name: Start the stack and seed deterministic data
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180 admin rules prometheus grafana
          # Dependencies above have applied migrations. Run seed in the foreground
          # and wait for its exit code; the live generator must not start yet.
          docker compose run --rm --no-deps seed

      - name: Seed invariants
        run: docker compose exec -T postgres psql -U antifraud -d antifraud -v ON_ERROR_STOP=1 -f - < db/tests/invariants.sql

      - name: Verify image versions and platform
        run: python ci/check_images.py

      - name: Postman collection against the real API
        run: |
          "$RUNNER_TEMP/newman/node_modules/.bin/newman" run api/postman/antifraud.postman_collection.json \
            --environment api/postman/local.postman_environment.json \
            --env-var baseUrl=http://127.0.0.1:8000 \
            --env-var apiKey=demo-full-key-change-me \
            --env-var readApiKey=demo-read-key-change-me \
            --timeout-request 10000 --timeout 120000 --bail

      - name: Detection scoring gate
        run: |
          docker compose exec -T rules python -c 'import runner; runner.run_all()'
          docker compose exec -T postgres psql -U antifraud -d antifraud -v ON_ERROR_STOP=1 -f - < db/scoring.sql
          docker compose exec -T postgres psql -U antifraud -d antifraud -v ON_ERROR_STOP=1 -f - < db/tests/scoring_gate.sql

      - name: Live generator and monitoring
        env:
          GRAFANA_ADMIN_PASSWORD: demo-grafana-admin-password-change-me
        run: |
          before=$(docker compose exec -T postgres psql -U antifraud -d antifraud -At -v ON_ERROR_STOP=1 \
            -c 'SELECT extract(epoch FROM sim_time)::bigint FROM sim_state WHERE id = 1')
          docker compose up -d --no-deps generator
          sleep 60
          # Check while the generator is alive: stopping it first makes its target DOWN.
          python ci/check_monitoring.py
          docker compose stop -t 30 generator
          container=$(docker compose ps -aq generator)
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
          after=$(docker compose exec -T postgres psql -U antifraud -d antifraud -At -v ON_ERROR_STOP=1 \
            -c 'SELECT extract(epoch FROM sim_time)::bigint FROM sim_state WHERE id = 1')
          test "$after" -gt "$before"
          echo "PASS live generator: sim_time advanced from $before to $after and exited cleanly"

      - name: Invariants after live catch-up
        run: docker compose exec -T postgres psql -U antifraud -d antifraud -v ON_ERROR_STOP=1 -f - < db/tests/invariants.sql

      - name: Save the images that passed the stack checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'druidpwnz/antifraud_lab'
        run: |
          docker save \
            "ghcr.io/druidpwnz/antifraud-api:$IMAGE_TAG" \
            "ghcr.io/druidpwnz/antifraud-admin:$IMAGE_TAG" \
            "ghcr.io/druidpwnz/antifraud-rules:$IMAGE_TAG" \
            "ghcr.io/druidpwnz/antifraud-generator:$IMAGE_TAG" | gzip > "$RUNNER_TEMP/tested-images.tar.gz"

      - name: Hand tested images to the publishing workflow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'druidpwnz/antifraud_lab'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-images.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Container status and logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color

      - name: Remove the CI stack and its volumes
        if: always()
        # Only the disposable project above; never use this on the home server.
        run: docker compose --env-file .env.example down --volumes --remove-orphans
