version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - /
      - /api
      - /admin
      - /generator
      - /rules
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
        # Update shared packages consistently across the services' requirements.
        group-by: dependency-name
